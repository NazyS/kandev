name: Dev container image

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve image metadata
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Resolve fork image and version
        id: metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/kandev" >> "$GITHUB_OUTPUT"
          echo "version=dev-${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build web SPA
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile
      - name: Build web
        env:
          KANDEV_VERSION: ${{ needs.prepare.outputs.version }}
          VITE_KANDEV_API_PORT: ""
          VITE_KANDEV_DEBUG: ""
        run: pnpm -C apps --filter @kandev/web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-web-bundle
          path: apps/web/dist
          include-hidden-files: true

  build-bundles:
    name: Build Linux bundle (${{ matrix.arch }})
    needs: [prepare, build-web]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            platform: linux-x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: 1
      GOOS: linux
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-web-bundle
          path: apps/backend/internal/webapp/embedded/generated
      - name: Build backend binaries
        env:
          KANDEV_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -f apps/backend/internal/webapp/embedded/generated/index.html
          cd apps/backend
          mkdir -p bin
          commit=$(git rev-parse --short HEAD)
          build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          ldflags="-s -w -X main.Version=${KANDEV_VERSION} -X main.Commit=${commit} -X main.BuildTime=${build_time}"
          echo "LDFLAGS=${ldflags}" >> "$GITHUB_ENV"
          go build -tags fts5 -ldflags "$ldflags" -o bin/kandev ./cmd/kandev
          go build -ldflags "$ldflags" -o bin/agentctl ./cmd/agentctl
      - name: Build remote agentctl helpers
        run: |
          set -euo pipefail
          cd apps/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 CC= go build -ldflags "$LDFLAGS" -o bin/agentctl-linux-amd64 ./cmd/agentctl
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CC= go build -ldflags "$LDFLAGS" -o bin/agentctl-linux-arm64 ./cmd/agentctl
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 CC= go build -ldflags "$LDFLAGS" -o bin/agentctl-darwin-arm64 ./cmd/agentctl
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 CC= go build -ldflags "$LDFLAGS" -o bin/agentctl-darwin-amd64 ./cmd/agentctl
      - name: Package bundle
        run: |
          set -euo pipefail
          rm -rf dist/kandev
          mkdir -p dist/kandev/bin
          cp apps/backend/bin/kandev dist/kandev/bin/
          cp apps/backend/bin/agentctl dist/kandev/bin/
          cp apps/backend/bin/agentctl-linux-amd64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-linux-arm64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-darwin-arm64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-darwin-amd64 dist/kandev/bin/
          bash scripts/release/package-bundle.sh --bundle-dir dist/kandev
          cd dist
          tar -czf "kandev-${{ matrix.platform }}.tar.gz" kandev
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-bundle-${{ matrix.platform }}
          path: dist/kandev-${{ matrix.platform }}.tar.gz

  docker-amd64:
    name: Build and push container (amd64)
    needs: [prepare, build-bundles]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ${{ needs.prepare.outputs.image }}:dev-staging-${{ github.run_id }}-amd64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-bundle-linux-x64
          path: dist/bundle
      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bundle
          tar -xzf dist/bundle/kandev-linux-x64.tar.gz --strip-components=1 -C ctx/bundle
          cp docker-entrypoint.sh ctx/
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}
      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ctx
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.STAGING_IMAGE }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=dev-base-amd64
          cache-to: type=gha,mode=max,scope=dev-base-amd64

  docker-arm64:
    name: Build and push container (arm64)
    needs: [prepare, build-bundles]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ${{ needs.prepare.outputs.image }}:dev-staging-${{ github.run_id }}-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-bundle-linux-arm64
          path: dist/bundle
      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bundle
          tar -xzf dist/bundle/kandev-linux-arm64.tar.gz --strip-components=1 -C ctx/bundle
          cp docker-entrypoint.sh ctx/
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}
      - name: Build and push staging image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ctx
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.STAGING_IMAGE }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=dev-base-arm64
          cache-to: type=gha,mode=max,scope=dev-base-arm64

  docker-manifest:
    name: Publish multi-arch dev image
    needs: [prepare, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      AMD64_REF: ${{ needs.prepare.outputs.image }}@${{ needs.docker-amd64.outputs.digest }}
      ARM64_REF: ${{ needs.prepare.outputs.image }}@${{ needs.docker-arm64.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dev tags
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:dev" \
            --tag "$IMAGE:$VERSION" \
            "$AMD64_REF" "$ARM64_REF"
